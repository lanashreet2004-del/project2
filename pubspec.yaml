name: p2
description: "AI-powered Arabic OCR application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  get: ^4.7.2
  get_storage: ^2.1.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  image: ^4.5.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  open_file_manager: ^1.1.1
  open_filex: ^4.7.0
  pdf: ^3.11.3
  docx_creator: ^1.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash/
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
